<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — StreakPrep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --dark:   #0B0F1A; --card: #111827; --card2: #162032;
      --border: #1E2A3B; --text: #F0F4FF; --muted: #6B7FA3;
      --orange: #FF6B35; --orange-glow: rgba(255,107,53,0.3);
      --green:  #22C55E; --red: #EF4444; --yellow: #F59E0B;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; background: var(--dark); color: var(--text); font-family: 'Inter', sans-serif; }

    nav { padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .logo { font-size: 1.1rem; font-weight: 900; color: var(--text); text-decoration: none; letter-spacing: -0.02em; }
    .logo span { color: var(--orange); }
    .nav-link { font-size: 0.82rem; color: var(--muted); text-decoration: none; font-weight: 500; transition: color 0.15s; }
    .nav-link:hover { color: var(--text); }

    .page { max-width: 600px; margin: 0 auto; padding: 28px 20px 80px; }

    /* Profile chips (sibling switcher) */
    .profiles { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .profile-chip {
      padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
      border: 1.5px solid var(--border); color: var(--muted); cursor: pointer;
      background: transparent; font-family: inherit; transition: all 0.15s;
    }
    .profile-chip:hover { border-color: rgba(255,107,53,0.4); color: var(--text); }
    .profile-chip.active { border-color: var(--orange); color: var(--orange); background: rgba(255,107,53,0.08); }

    /* Section cards */
    .section { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-bottom: 16px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .section-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .section-edit { font-size: 0.78rem; font-weight: 700; color: var(--orange); cursor: pointer; background: none; border: none; font-family: inherit; transition: opacity 0.15s; }
    .section-edit:hover { opacity: 0.7; }

    /* Info rows */
    .info-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .info-row:last-child { border-bottom: none; padding-bottom: 0; }
    .info-label { font-size: 0.82rem; color: var(--muted); font-weight: 500; }
    .info-value { font-size: 0.85rem; font-weight: 700; color: var(--text); }

    /* Subscription banner */
    .sub-banner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-radius: 12px; font-size: 0.83rem; font-weight: 600; margin-bottom: 12px;
    }
    .sub-banner.trial   { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25); color: var(--yellow); }
    .sub-banner.active  { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.25);  color: var(--green); }
    .sub-banner.grace,
    .sub-banner.expired { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.25);  color: var(--red); }
    .sub-banner.none    { background: rgba(107,127,163,0.08); border: 1px solid var(--border);        color: var(--muted); }
    .sub-upgrade { font-size: 0.75rem; font-weight: 700; color: var(--orange); text-decoration: none; white-space: nowrap; margin-left: 12px; }

    /* Subject checkboxes */
    .subj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .subj-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-radius: 12px; cursor: pointer;
      border: 1.5px solid var(--border); background: transparent; font-family: inherit;
      transition: border-color 0.15s, background 0.15s; color: var(--text); font-size: 0.85rem; font-weight: 600;
    }
    .subj-item:hover { border-color: rgba(255,107,53,0.4); }
    .subj-item.selected { border-color: var(--orange); background: rgba(255,107,53,0.08); }
    .subj-item[disabled] { opacity: 0.5; cursor: default; }
    .subj-check {
      width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 0.7rem; flex-shrink: 0;
      transition: all 0.15s;
    }
    .subj-item.selected .subj-check { background: var(--orange); border-color: var(--orange); color: white; }
    .subj-item.selected .subj-check::after { content: '✓'; }

    .pricing-note { font-size: 0.78rem; color: var(--muted); margin-top: 10px; line-height: 1.5; }
    .pricing-note .nudge { color: var(--orange); font-weight: 700; }

    /* PIN form */
    .pin-form { margin-top: 14px; display: none; }
    .pin-form.open { display: block; }
    .form-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: block; margin-top: 14px; }
    .form-label:first-child { margin-top: 0; }
    .pin-row { display: flex; gap: 8px; }
    .pin-box {
      width: 52px; height: 58px; text-align: center; font-size: 1.4rem; font-weight: 700;
      background: rgba(255,255,255,0.04); border: 1.5px solid var(--border);
      border-radius: 10px; color: var(--text); font-family: inherit;
      caret-color: var(--orange); transition: border-color 0.15s; -webkit-appearance: none;
    }
    .pin-box:focus { outline: none; border-color: var(--orange); }
    .pin-box.filled { border-color: rgba(255,107,53,0.5); }

    /* Buttons */
    .btn-primary {
      width: 100%; padding: 13px; background: var(--orange); color: white;
      border: none; border-radius: 12px; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; font-family: inherit; margin-top: 16px;
      box-shadow: 0 6px 24px var(--orange-glow); transition: transform 0.15s, opacity 0.15s;
    }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-cancel {
      width: 100%; padding: 11px; background: transparent; color: var(--muted);
      border: 1.5px solid var(--border); border-radius: 12px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; font-family: inherit; margin-top: 8px; transition: color 0.15s;
    }
    .btn-cancel:hover { color: var(--text); }

    /* Danger zone */
    .danger-btn {
      width: 100%; padding: 12px; background: transparent; color: var(--red);
      border: 1.5px solid rgba(239,68,68,0.3); border-radius: 12px; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: background 0.15s;
    }
    .danger-btn:hover { background: rgba(239,68,68,0.08); }

    .err-msg { font-size: 0.8rem; color: var(--red); min-height: 18px; margin-top: 8px; text-align: center; }
    .ok-msg  { font-size: 0.8rem; color: var(--green); min-height: 18px; margin-top: 8px; text-align: center; font-weight: 700; }

    .loading { text-align: center; padding: 80px 20px; color: var(--muted); }

    @media (max-width: 420px) {
      .subj-grid { grid-template-columns: 1fr; }
      .pin-box { width: 46px; height: 52px; font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo">Streak<span>Prep</span></a>
  <a href="/dashboard" class="nav-link">← Dashboard</a>
</nav>

<div class="page" id="page">
  <div class="loading">Loading account…</div>
</div>

<script>
  const ALL_SUBJECTS = [
    { key: 'mathematics',    label: 'Mathematics' },
    { key: 'science',        label: 'Science' },
    { key: 'english',        label: 'English' },
    { key: 'hindi',          label: 'Hindi' },
    { key: 'social_science', label: 'Social Science' },
  ];

  let accountData = null;
  let editingSubjects = false;
  let selectedSubjects = [];

  async function init() {
    const session = localStorage.getItem('sp_session');
    if (!session) { window.location.href = '/login'; return; }

    let data;
    try {
      const res = await fetch('/api/account', {
        headers: { 'Authorization': 'Bearer ' + session },
      });
      if (res.status === 401) { localStorage.removeItem('sp_session'); window.location.href = '/login'; return; }
      if (!res.ok) { showErr('Could not load account. Please try again.'); return; }
      data = await res.json();
    } catch {
      showErr('Network error. Please check your connection.');
      return;
    }

    accountData = data;
    selectedSubjects = [...data.student.subjects];
    renderPage();
  }

  function renderPage() {
    const d = accountData;
    const subType = d.subscription.type;
    const upgradeLink = (subType !== 'active')
      ? `<a href="/pay" class="sub-upgrade">Upgrade →</a>` : '';

    const profilesHtml = d.siblings.length > 1 ? `
      <div class="profiles">
        ${d.siblings.map(s => `
          <button class="profile-chip ${s.id === d.activeStudentId ? 'active' : ''}"
            onclick="switchProfile(${s.id})">
            ${s.name} · Cl.${s.class}
          </button>`).join('')}
      </div>` : '';

    document.getElementById('page').innerHTML = `
      ${profilesHtml}

      <!-- Profile -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Student Profile</span>
        </div>
        <div class="info-row">
          <span class="info-label">Name</span>
          <span class="info-value">${esc(d.student.name)}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Class</span>
          <span class="info-value">Class ${d.student.class}</span>
        </div>
      </div>

      <!-- Subscription -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Subscription</span>
          ${subType !== 'active' ? `<a href="/pay" class="section-edit">Upgrade →</a>` : ''}
        </div>
        <div class="sub-banner ${subType}" style="margin-top:12px;margin-bottom:0">
          <span>${d.subscription.label}</span>
        </div>
      </div>

      <!-- Subjects -->
      <div class="section" id="subj-section">
        <div class="section-header">
          <span class="section-title">Subjects</span>
          <button class="section-edit" onclick="toggleSubjectEdit()">Edit</button>
        </div>
        <div id="subj-display">
          ${d.student.subjects.map(s => `
            <div class="info-row"><span class="info-label">${subjLabel(s)}</span><span class="info-value">✓</span></div>
          `).join('')}
        </div>
        <div id="subj-editor" style="display:none">
          <div class="subj-grid" id="subj-grid"></div>
          <p class="pricing-note" id="subj-price-note"></p>
          <p class="err-msg" id="subj-err"></p>
          <p class="ok-msg" id="subj-ok"></p>
          <button class="btn-primary" onclick="saveSubjects()">Save Changes</button>
          <button class="btn-cancel" onclick="cancelSubjectEdit()">Cancel</button>
        </div>
      </div>

      <!-- PIN -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Security</span>
          <button class="section-edit" onclick="togglePinForm()">Change PIN</button>
        </div>
        <div id="pin-form" class="pin-form">
          <label class="form-label">Current PIN</label>
          <div class="pin-row" id="cur-pin-boxes">
            <input class="pin-box" maxlength="1" inputmode="numeric" type="password" />
            <input class="pin-box" maxlength="1" inputmode="numeric" type="password" />
            <input class="pin-box" maxlength="1" inputmode="numeric" type="password" />
            <input class="pin-box" maxlength="1" inputmode="numeric" type="password" />
          </div>
          <label class="form-label">New PIN</label>
          <div class="pin-row" id="new-pin-boxes">
            <input class="pin-box" maxlength="1" inputmode="numeric" type="password" />
            <input class="pin-box" maxlength="1" inputmode="numeric" type="password" />
            <input class="pin-box" maxlength="1" inputmode="numeric" type="password" />
            <input class="pin-box" maxlength="1" inputmode="numeric" type="password" />
          </div>
          <label class="form-label">Confirm New PIN</label>
          <div class="pin-row" id="conf-pin-boxes">
            <input class="pin-box" maxlength="1" inputmode="numeric" type="password" />
            <input class="pin-box" maxlength="1" inputmode="numeric" type="password" />
            <input class="pin-box" maxlength="1" inputmode="numeric" type="password" />
            <input class="pin-box" maxlength="1" inputmode="numeric" type="password" />
          </div>
          <p class="err-msg" id="pin-err"></p>
          <p class="ok-msg"  id="pin-ok"></p>
          <button class="btn-primary" id="pin-save-btn" onclick="savePin()">Update PIN</button>
          <button class="btn-cancel" onclick="cancelPinForm()">Cancel</button>
        </div>
        <div id="pin-info" style="padding-top:4px">
          <div class="info-row"><span class="info-label">PIN</span><span class="info-value">••••</span></div>
        </div>
      </div>

      <!-- Parent info -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Parent / Contact</span>
        </div>
        <div class="info-row">
          <span class="info-label">WhatsApp</span>
          <span class="info-value">${esc(d.parent.phone)}</span>
        </div>
        ${d.parent.email ? `
        <div class="info-row">
          <span class="info-label">Email</span>
          <span class="info-value">${esc(d.parent.email)}</span>
        </div>` : ''}
        <p style="font-size:0.75rem;color:var(--muted);margin-top:10px;line-height:1.5">
          To change your phone number, contact <a href="mailto:riddhimaa@streakprep.ai" style="color:var(--orange)">riddhimaa@streakprep.ai</a>
        </p>
      </div>

      <!-- Logout -->
      <div class="section">
        <button class="danger-btn" onclick="logout()">Log Out</button>
      </div>
    `;

    // Setup PIN boxes
    setupPinBoxes('cur-pin-boxes');
    setupPinBoxes('new-pin-boxes');
    setupPinBoxes('conf-pin-boxes');

    // Render subject editor grid
    renderSubjectGrid();
  }

  function renderSubjectGrid() {
    const grid = document.getElementById('subj-grid');
    if (!grid) return;
    grid.innerHTML = ALL_SUBJECTS.map(s => `
      <button class="subj-item ${selectedSubjects.includes(s.key) ? 'selected' : ''}"
        onclick="toggleSubject('${s.key}')">
        <span class="subj-check"></span>
        <span>${s.label}</span>
      </button>`).join('');
    updatePriceNote();
  }

  function toggleSubject(key) {
    const idx = selectedSubjects.indexOf(key);
    if (idx >= 0) {
      if (selectedSubjects.length <= 1) return; // must keep at least 1
      selectedSubjects.splice(idx, 1);
    } else {
      selectedSubjects.push(key);
    }
    renderSubjectGrid();
  }

  function updatePriceNote() {
    const n = selectedSubjects.length;
    const el = document.getElementById('subj-price-note');
    if (!el) return;
    const { plan, price } = planFor(n);
    let note = `<strong style="color:var(--text)">${n} subject${n>1?'s':''} — ${plan} plan ₹${price}/month</strong>`;
    if (n === 2) note += `<br><span class="nudge">Add 1 more subject for free! (3 subjects = same price)</span>`;
    if (n === 4) note += `<br><span class="nudge">Add 1 more — all 5 subjects same price!</span>`;
    el.innerHTML = note;
  }

  function planFor(n) {
    if (n <= 1) return { plan: 'Starter', price: 99 };
    if (n <= 3) return { plan: 'Core',    price: 199 };
    return               { plan: 'Full',    price: 249 };
  }

  function toggleSubjectEdit() {
    selectedSubjects = [...accountData.student.subjects];
    document.getElementById('subj-display').style.display = 'none';
    document.getElementById('subj-editor').style.display = 'block';
    document.querySelector('#subj-section .section-edit').style.display = 'none';
    renderSubjectGrid();
  }

  function cancelSubjectEdit() {
    selectedSubjects = [...accountData.student.subjects];
    document.getElementById('subj-display').style.display = 'block';
    document.getElementById('subj-editor').style.display = 'none';
    document.querySelector('#subj-section .section-edit').style.display = '';
  }

  async function saveSubjects() {
    document.getElementById('subj-err').textContent = '';
    document.getElementById('subj-ok').textContent = '';
    if (selectedSubjects.length === 0) {
      document.getElementById('subj-err').textContent = 'Select at least one subject.';
      return;
    }

    const session = localStorage.getItem('sp_session');
    try {
      const res = await fetch('/api/account/subjects', {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + session, 'Content-Type': 'application/json' },
        body: JSON.stringify({ subjects: selectedSubjects }),
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('subj-err').textContent = data.error || 'Save failed.';
        return;
      }
      accountData.student.subjects = [...selectedSubjects];
      document.getElementById('subj-ok').textContent = '✓ Subjects updated!';
      setTimeout(() => {
        cancelSubjectEdit();
        // Re-render info-row list
        document.getElementById('subj-display').innerHTML = selectedSubjects.map(s => `
          <div class="info-row"><span class="info-label">${subjLabel(s)}</span><span class="info-value">✓</span></div>
        `).join('');
      }, 800);
    } catch {
      document.getElementById('subj-err').textContent = 'Network error. Please try again.';
    }
  }

  function togglePinForm() {
    const form = document.getElementById('pin-form');
    const info = document.getElementById('pin-info');
    form.classList.toggle('open');
    info.style.display = form.classList.contains('open') ? 'none' : 'block';
    document.querySelector('.section:has(#pin-form) .section-edit').style.display =
      form.classList.contains('open') ? 'none' : '';
  }

  function cancelPinForm() {
    const form = document.getElementById('pin-form');
    form.classList.remove('open');
    document.getElementById('pin-info').style.display = 'block';
    document.querySelector('.section:has(#pin-form) .section-edit').style.display = '';
    clearPinBoxes('cur-pin-boxes');
    clearPinBoxes('new-pin-boxes');
    clearPinBoxes('conf-pin-boxes');
    document.getElementById('pin-err').textContent = '';
    document.getElementById('pin-ok').textContent = '';
  }

  function clearPinBoxes(id) {
    document.querySelectorAll('#' + id + ' .pin-box').forEach(b => {
      b.value = ''; b.classList.remove('filled');
    });
  }

  async function savePin() {
    const currentPin = getPinValue('cur-pin-boxes');
    const newPin     = getPinValue('new-pin-boxes');
    const confPin    = getPinValue('conf-pin-boxes');
    const errEl      = document.getElementById('pin-err');
    const okEl       = document.getElementById('pin-ok');
    errEl.textContent = ''; okEl.textContent = '';

    if (currentPin.length < 4) { errEl.textContent = 'Enter your current 4-digit PIN.'; return; }
    if (newPin.length < 4)     { errEl.textContent = 'Enter a new 4-digit PIN.'; return; }
    if (confPin !== newPin)    { errEl.textContent = 'New PINs don\'t match.'; return; }
    if (newPin === currentPin) { errEl.textContent = 'New PIN must be different.'; return; }

    const btn = document.getElementById('pin-save-btn');
    btn.disabled = true; btn.textContent = 'Updating…';

    const session = localStorage.getItem('sp_session');
    try {
      const res = await fetch('/api/account/pin', {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + session, 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPin, newPin }),
      });
      const data = await res.json();
      btn.disabled = false; btn.textContent = 'Update PIN';

      if (res.status === 401) { errEl.textContent = 'Current PIN is incorrect.'; return; }
      if (!res.ok) { errEl.textContent = data.error || 'Update failed.'; return; }

      okEl.textContent = '✓ PIN updated successfully!';
      clearPinBoxes('cur-pin-boxes');
      clearPinBoxes('new-pin-boxes');
      clearPinBoxes('conf-pin-boxes');
      setTimeout(cancelPinForm, 1500);
    } catch {
      btn.disabled = false; btn.textContent = 'Update PIN';
      errEl.textContent = 'Network error. Please try again.';
    }
  }

  async function switchProfile(studentId) {
    const session = localStorage.getItem('sp_session');
    await fetch('/api/session/switch', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + session, 'Content-Type': 'application/json' },
      body: JSON.stringify({ studentId }),
    });
    init();
  }

  function logout() {
    localStorage.removeItem('sp_session');
    localStorage.removeItem('sp_device');
    window.location.href = '/login';
  }

  function showErr(msg) {
    document.getElementById('page').innerHTML = `
      <div style="text-align:center;padding:80px 20px">
        <p style="color:var(--muted)">${msg}</p>
        <a href="/dashboard" style="color:var(--orange);font-size:0.85rem;display:block;margin-top:16px">← Dashboard</a>
      </div>`;
  }

  // PIN box helpers
  function setupPinBoxes(containerId) {
    const boxes = [...document.querySelectorAll('#' + containerId + ' .pin-box')];
    boxes.forEach((box, i) => {
      box.addEventListener('input', e => {
        const val = e.target.value.replace(/\D/g, '');
        e.target.value = val ? val[val.length - 1] : '';
        e.target.classList.toggle('filled', !!e.target.value);
        if (e.target.value && i < boxes.length - 1) boxes[i + 1].focus();
      });
      box.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
      });
    });
  }

  function getPinValue(containerId) {
    return [...document.querySelectorAll('#' + containerId + ' .pin-box')].map(b => b.value).join('');
  }

  function subjLabel(key) {
    return { mathematics:'Mathematics', science:'Science', english:'English', hindi:'Hindi', social_science:'Social Science' }[key] || key;
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
