<!DOCTYPE html>
<html lang="en">
<head>
<script src="/track.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscribe — StreakPrep</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --dark:   #0B0F1A;
      --card:   #111827;
      --border: #1E2A3B;
      --text:   #F0F4FF;
      --muted:  #6B7FA3;
      --orange: #FF6B35;
      --orange-glow: rgba(255,107,53,0.35);
      --green:  #22C55E;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh; background: var(--dark); color: var(--text);
      font-family: 'Inter', sans-serif; display: flex; flex-direction: column;
    }
    nav {
      padding: 16px 24px; display: flex; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 1.15rem; font-weight: 900; color: var(--text); text-decoration: none; letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 8px; }
    .logo-icon { width: 38px; height: 38px; }
    .logo span { color: var(--orange); }
    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .card {
      width: 100%; max-width: 460px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 36px 32px;
    }
    .step-icon  { font-size: 2rem; margin-bottom: 10px; }
    .step-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; }
    .step-sub   { font-size: 0.83rem; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }

    .student-option {
      display: block; width: 100%; text-align: left; cursor: pointer;
      background: rgba(255,255,255,0.03); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 16px 18px; margin-bottom: 12px;
      font-family: inherit; color: var(--text); transition: border-color 0.15s;
    }
    .student-option:hover { border-color: var(--orange); }
    .student-option .name  { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
    .student-option .meta  { font-size: 0.8rem; color: var(--muted); }
    .student-option .plan  { font-size: 0.8rem; color: var(--orange); font-weight: 600; margin-top: 6px; }

    .plan-summary {
      background: rgba(255,107,53,0.08); border: 1px solid rgba(255,107,53,0.3);
      border-radius: 14px; padding: 20px; margin-bottom: 20px; text-align: center;
    }
    .plan-summary .plan-name  { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; }
    .plan-summary .plan-price { font-size: 1.6rem; font-weight: 900; color: var(--orange); }
    .plan-summary .plan-status{ font-size: 0.8rem; color: var(--muted); margin-top: 8px; }

    .btn-primary {
      width: 100%; padding: 14px; background: var(--orange); color: white;
      border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; font-family: inherit; margin-top: 8px;
      box-shadow: 0 8px 30px rgba(255,107,53,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 40px rgba(255,107,53,0.4); }
    .btn-back {
      background: none; border: none; color: var(--muted); font-size: 0.82rem;
      cursor: pointer; font-family: inherit; margin-top: 16px; display: block;
      width: 100%; text-align: center;
    }
    .btn-back:hover { color: var(--text); }

    .notice {
      font-size: 0.85rem; color: var(--muted); text-align: center;
      margin-top: 16px; line-height: 1.5; display: none;
    }
    .notice.show { display: block; }

    .form-label { display: block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .form-input {
      width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border); border-radius: 10px; color: var(--text);
      font-size: 0.9rem; font-family: inherit; margin-bottom: 8px; text-transform: uppercase;
    }
    .form-input:focus { outline: none; border-color: var(--orange); }
    .coupon-err { font-size: 0.78rem; color: #EF4444; min-height: 16px; margin-bottom: 8px; }
    .coupon-ok  { font-size: 0.78rem; color: var(--green); min-height: 16px; margin-bottom: 8px; }

    .err-msg { font-size: 0.85rem; color: #EF4444; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
<nav>
  <a href="/dashboard" class="logo"><img src="/logo.svg?v=2" alt="" class="logo-icon" />Streak<span>Prep</span></a>
</nav>
<main>
  <div class="card" id="card">
    <div class="step-icon">⏳</div>
    <p class="step-sub">Loading…</p>
  </div>
</main>

<script>
  let students   = [];
  let selectedId = null;

  async function init() {
    const session = localStorage.getItem('sp_session');
    if (!session) { window.location.href = '/login'; return; }

    track('pay_view');

    let data, res;
    try {
      res = await fetch('/api/pay/students', { headers: { Authorization: 'Bearer ' + session } });
    } catch {
      renderError('Network error. Please try again.');
      return;
    }
    if (res.status === 401) { localStorage.removeItem('sp_session'); window.location.href = '/login'; return; }
    if (!res.ok) { renderError('Could not load your account. Please try again.'); return; }
    data = await res.json();
    students = data.students || [];

    if (!students.length) { renderError('No student profiles found on this account.'); return; }

    if (students.length === 1) {
      selectedId = students[0].id;
      renderPlanStep(students[0]);
    } else {
      renderPicker();
    }
  }

  function renderError(msg) {
    document.getElementById('card').innerHTML = `<div class="err-msg">${msg}</div>`;
  }

  function renderPicker() {
    track('pay_picker_shown', { studentCount: students.length });
    const optionsHtml = students.map(s => `
      <button class="student-option" onclick="selectStudent(${s.id})">
        <div class="name">${escapeHtml(s.name)}</div>
        <div class="meta">Class ${s.class} · ${s.subjectCount} subject${s.subjectCount === 1 ? '' : 's'}</div>
        <div class="plan">${planLabel(s.plan)} — ₹${(s.amountPaise / 100).toFixed(0)}/mo · ${s.subscription.label}</div>
      </button>
    `).join('');

    document.getElementById('card').innerHTML = `
      <div class="step-icon">👨‍👩‍👧‍👦</div>
      <div class="step-title">Which student is this for?</div>
      <p class="step-sub">You have more than one child registered — each has their own subscription.</p>
      ${optionsHtml}
    `;
  }

  function selectStudent(id) {
    const student = students.find(s => s.id === id);
    selectedId = id;
    track('pay_student_picked', { studentId: id });
    renderPlanStep(student, students.length > 1);
  }

  function renderPlanStep(student, showBack) {
    document.getElementById('card').innerHTML = `
      <div class="step-icon">💳</div>
      <div class="step-title">Subscribe for ${escapeHtml(student.name)}</div>
      <p class="step-sub">Class ${student.class} · ${student.subjectCount} subject${student.subjectCount === 1 ? '' : 's'}</p>
      <div class="plan-summary">
        <div class="plan-name">${planLabel(student.plan)}</div>
        <div class="plan-price" id="plan-price">₹${(student.amountPaise / 100).toFixed(0)}<span style="font-size:0.9rem;color:var(--muted);font-weight:600;">/month</span></div>
        <div class="plan-status">${student.subscription.label}</div>
      </div>
      <label class="form-label">Coupon code (optional)</label>
      <input type="text" class="form-input" id="coupon-input" placeholder="e.g. LAUNCH50" />
      <div class="coupon-err" id="coupon-err"></div>
      <button class="btn-primary" id="pay-btn" onclick="startPayment(${student.id})">Continue to Payment →</button>
      ${showBack ? `<button class="btn-back" onclick="renderPicker()">← Choose a different student</button>` : ''}
      <p class="notice" id="pay-notice"></p>
    `;
  }

  async function startPayment(studentId) {
    const btn       = document.getElementById('pay-btn');
    const couponErr = document.getElementById('coupon-err');
    const notice    = document.getElementById('pay-notice');
    const couponCode = document.getElementById('coupon-input').value.trim();
    couponErr.textContent = '';
    btn.disabled = true; btn.textContent = 'Please wait…';

    track('pay_continue_clicked', { studentId, couponEntered: !!couponCode });

    const session = localStorage.getItem('sp_session');
    let res, data;
    try {
      res = await fetch('/api/pay/create-subscription', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session },
        body: JSON.stringify({ studentId, couponCode: couponCode || undefined }),
      });
      data = await res.json().catch(() => ({}));
    } catch {
      btn.disabled = false; btn.textContent = 'Continue to Payment →';
      couponErr.textContent = 'Network error. Please try again.';
      return;
    }

    if (res.status === 503 || data.error === 'not_configured') {
      // Razorpay isn't wired up yet (no live keys) — honest placeholder, not a broken error.
      track('pay_not_configured', { studentId });
      notice.textContent = "Online payments are being set up right now — we'll message you on WhatsApp the moment it's ready. Thanks for your patience! In the meantime, your free trial (and streak) keeps going.";
      notice.classList.add('show');
      return;
    }
    if (data.error === 'invalid_coupon') {
      btn.disabled = false; btn.textContent = 'Continue to Payment →';
      couponErr.textContent = 'That coupon code is invalid or expired.';
      return;
    }
    if (data.error === 'already_active') {
      notice.textContent = "This subscription is already active — refresh your dashboard to see it.";
      notice.classList.add('show');
      return;
    }
    if (!res.ok) {
      btn.disabled = false; btn.textContent = 'Continue to Payment →';
      couponErr.textContent = 'Something went wrong. Please try again.';
      return;
    }

    // Razorpay Checkout — embedded modal, no page redirect. UPI is put first
    // and expanded by default (QR/intent — Razorpay auto-renders the QR code
    // for subscriptions, no extra flag needed) since that's how most Indian
    // parents will actually pay; card/netbanking stay available below it via
    // show_default_blocks, not hidden entirely.
    const rzp = new Razorpay({
      key: data.keyId,
      subscription_id: data.subscriptionId,
      name: 'StreakPrep',
      description: planLabel(data.planName) + ' subscription',
      theme: { color: '#FF6B35' },
      config: {
        display: {
          blocks: {
            upi: { name: 'Pay via UPI', instruments: [{ method: 'upi' }] },
          },
          sequence: ['block.upi'],
          preferences: { show_default_blocks: true },
        },
      },
      handler: function () {
        track('pay_checkout_success', { studentId });
        btn.textContent = 'Payment received ✓';
        notice.textContent = "Payment received! We'll confirm your subscription shortly — refresh your dashboard in a moment.";
        notice.classList.add('show');
      },
      modal: {
        ondismiss: function () {
          track('pay_checkout_dismissed', { studentId });
          btn.disabled = false; btn.textContent = 'Continue to Payment →';
        },
      },
    });
    rzp.on('payment.failed', function () {
      track('pay_checkout_failed', { studentId });
      btn.disabled = false; btn.textContent = 'Continue to Payment →';
      couponErr.textContent = 'Payment failed. Please try again.';
    });
    rzp.open();
  }

  function planLabel(plan) {
    return plan === 'starter' ? 'Starter — 1 Subject'
         : plan === 'core'    ? 'Core — 3 Subjects'
         : 'Full Prep — 5 Subjects';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  init();
</script>
</body>
</html>
